<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QRku</title>
    <style>
      html, body { margin: 0; height: 100%; background: #fff; }
      iframe { border: 0; width: 100%; height: 100%; }
      p { margin: 24px; font: 16px/24px sans-serif; }
    </style>
  </head>
  <body>
    <iframe id="gambar" sandbox title="Gambar"></iframe>
    <script>
      const fromQuery = new URLSearchParams(location.search).get("d") || "";
      const fromHash = location.hash.length > 1 ? decodeURIComponent(location.hash.slice(1)) : "";
      const code = fromQuery || fromHash;
      const frame = document.getElementById("gambar");
      try {
        if (!code) throw new Error("kosong");
        const pad = code.length % 4 ? "=".repeat(4 - (code.length % 4)) : "";
        const b64 = code.replace(/-/g, "+").replace(/_/g, "/") + pad;
        const binary = atob(b64);
        const bytes = new Uint8Array(binary.length);
        for (let index = 0; index < binary.length; index += 1) bytes[index] = binary.charCodeAt(index);
        frame.srcdoc = new TextDecoder().decode(bytes);
      } catch (error) {
        frame.remove();
        const note = document.createElement("p");
        note.textContent = "Tautan gambar tidak valid.";
        document.body.append(note);
      }
    </script>
  </body>
</html>
