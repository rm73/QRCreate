<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QRku</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Outfit:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <section class="hero" id="hero">
      <div class="hero-copy">
        <h1>QRku</h1>
        <p>Convert Link, Wi-Fi, Low Res Image, and Gif into a QR</p>
        <p class="hero-ask">where should we start?</p>
        <div class="hero-actions">
          <a class="btn" href="/link">Link</a>
          <a class="btn" href="/wifi">Wifi</a>
          <a class="btn" href="/image">Image</a>
          <a class="btn" href="/gif">Gif</a>
        </div>
      </div>
      <div class="hero-mark">
        <img src="/assets/mark.svg" alt="" width="360" height="360" />
        <img class="cursor" src="/assets/cursor.svg" alt="" width="84" height="96" />
      </div>
    </section>
  </body>
</html>
